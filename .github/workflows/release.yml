name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  tag:
    name: Create tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.RELEASE_VERSION }}"
          git push origin "${{ env.RELEASE_VERSION }}"

  build:
    name: Build (${{ matrix.name }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-cpu
            runner: ubuntu-latest
            os: linux
            arch: amd64
            backend: cpu
            cmake_flags: -DGGML_NATIVE=OFF
            c_flags: -march=x86-64-v2 -O3 -flto
            cxx_flags: -march=x86-64-v2 -O3 -flto

          - name: linux-amd64-vulkan
            runner: ubuntu-latest
            os: linux
            arch: amd64
            backend: vulkan
            cmake_flags: -DGGML_VULKAN=ON -DGGML_NATIVE=OFF
            c_flags: -march=x86-64-v2 -O3 -flto
            cxx_flags: -march=x86-64-v2 -O3 -flto
            vulkan: true

          - name: linux-amd64-cuda
            runner: ubuntu-latest
            os: linux
            arch: amd64
            backend: cuda
            cmake_flags: -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=52\;61\;70\;75\;80\;86\;89\;90
            c_flags: -march=x86-64-v2 -O3 -flto
            cxx_flags: -march=x86-64-v2 -O3 -flto
            cuda: true

          - name: linux-arm64-cpu
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            backend: cpu
            cmake_flags: -DGGML_NATIVE=OFF
            c_flags: -O3 -flto
            cxx_flags: -O3 -flto

          - name: darwin-amd64-cpu
            runner: macos-13
            os: darwin
            arch: amd64
            backend: cpu
            cmake_flags: -DGGML_NATIVE=OFF
            c_flags: -O3 -flto
            cxx_flags: -O3 -flto

          - name: darwin-amd64-metal
            runner: macos-13
            os: darwin
            arch: amd64
            backend: metal
            cmake_flags: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF
            c_flags: -O3 -flto
            cxx_flags: -O3 -flto

          - name: darwin-arm64-cpu
            runner: macos-latest
            os: darwin
            arch: arm64
            backend: cpu
            cmake_flags: -DGGML_NATIVE=OFF
            c_flags: -O3 -flto
            cxx_flags: -O3 -flto

          - name: darwin-arm64-metal
            runner: macos-latest
            os: darwin
            arch: arm64
            backend: metal
            cmake_flags: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF
            c_flags: -O3 -flto
            cxx_flags: -O3 -flto

          - name: windows-amd64-cpu
            runner: windows-latest
            os: windows
            arch: amd64
            backend: cpu
            cmake_flags: -DGGML_NATIVE=OFF
            c_flags: /O2
            cxx_flags: /O2

          - name: windows-amd64-vulkan
            runner: windows-latest
            os: windows
            arch: amd64
            backend: vulkan
            cmake_flags: -DGGML_VULKAN=ON -DGGML_NATIVE=OFF
            c_flags: /O2
            cxx_flags: /O2
            vulkan: true

          - name: windows-amd64-cuda
            runner: windows-latest
            os: windows
            arch: amd64
            backend: cuda
            cmake_flags: -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=52\;61\;70\;75\;80\;86\;89\;90
            c_flags: /O2
            cxx_flags: /O2
            cuda: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CUDA (Linux)
        if: matrix.cuda && matrix.os == 'linux'
        shell: bash
        run: |
          UBUNTU_VER=$(lsb_release -rs | tr -d '.')
          curl -fsSL "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb" \
            -o /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-toolkit-12-4
          echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"

      - name: Setup CUDA (Windows)
        if: matrix.cuda && matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.4.0/network_installers/cuda_12.4.0_windows_network.exe" -OutFile "$env:TEMP\cuda_install.exe"
          Start-Process -Wait -FilePath "$env:TEMP\cuda_install.exe" -ArgumentList "-s nvcc,cudart"

      - name: Setup Vulkan SDK (Linux)
        if: matrix.vulkan && matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev vulkan-tools shaderc

      - name: Setup Vulkan SDK (Windows)
        if: matrix.vulkan && matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe" -OutFile "$env:TEMP\VulkanSDK.exe"
          Start-Process -Wait -FilePath "$env:TEMP\VulkanSDK.exe" -ArgumentList "/S"

      - name: Configure CMake
        shell: bash
        working-directory: llama-cpp-turboquant
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_TOOLS_INSTALL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            ${{ matrix.cmake_flags }}

      - name: Build
        shell: bash
        working-directory: llama-cpp-turboquant
        run: |
          JOBS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)
          cmake --build build --config Release -j "$JOBS"

      - name: Prepare asset
        shell: bash
        run: |
          ASSET="hive-cli-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            ASSET="${ASSET}.exe"
            SRC="llama-cpp-turboquant/build/bin/Release/hive-cli.exe"
            if [ ! -f "$SRC" ]; then
              SRC="llama-cpp-turboquant/build/bin/hive-cli.exe"
            fi
          else
            SRC="llama-cpp-turboquant/build/bin/hive-cli"
          fi

          if [ ! -f "$SRC" ]; then
            echo "Error: binary not found at $SRC"
            find llama-cpp-turboquant/build -name "hive-cli*" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$SRC" "$ASSET"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"
          echo "Prepared asset: $ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        shell: bash
        run: |
          mkdir -p assets
          find artifacts -type f -exec cp -v {} assets/ \;
          cp -v install.sh install.ps1 assets/
          ls -la assets/

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: hive-cli ${{ env.RELEASE_VERSION }}
          body: |
            ## hive-cli ${{ env.RELEASE_VERSION }}

            ### Assets

            | Asset | Descripción |
            |-------|-------------|
            | `hive-cli-linux-amd64-cpu` | Linux x86_64 — CPU |
            | `hive-cli-linux-amd64-vulkan` | Linux x86_64 — Vulkan |
            | `hive-cli-linux-amd64-cuda` | Linux x86_64 — CUDA (NVIDIA) |
            | `hive-cli-linux-arm64-cpu` | Linux ARM64 — CPU |
            | `hive-cli-darwin-amd64-cpu` | macOS Intel — CPU |
            | `hive-cli-darwin-amd64-metal` | macOS Intel — Metal |
            | `hive-cli-darwin-arm64-cpu` | macOS Apple Silicon — CPU |
            | `hive-cli-darwin-arm64-metal` | macOS Apple Silicon — Metal |
            | `hive-cli-windows-amd64-cpu.exe` | Windows x86_64 — CPU |
            | `hive-cli-windows-amd64-vulkan.exe` | Windows x86_64 — Vulkan |
            | `hive-cli-windows-amd64-cuda.exe` | Windows x86_64 — CUDA (NVIDIA) |
            | `install.sh` | Script de instalación (Linux/macOS) |
            | `install.ps1` | Script de instalación (Windows) |
            | `checksums.txt` | Checksums SHA-256 |

            ### Instalación rápida

            **Linux/macOS:**
            ```bash
            curl -sSL https://github.com/johpaz/hive-cli/releases/latest/download/install.sh | bash
            ```

            **Windows:**
            ```powershell
            iwr -Uri https://github.com/johpaz/hive-cli/releases/latest/download/install.ps1 -OutFile install.ps1
            .\install.ps1
            ```

            > Los scripts detectan automáticamente tu plataforma y backend óptimo.
          files: assets/*
